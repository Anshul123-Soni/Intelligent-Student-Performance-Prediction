<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Intelligent Student Performance Prediction</h1>
        <p class="subtitle">Enter academic information to predict performance.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('predict') }}">
            <label>Student Name</label>
            <input type="text" name="name" required>

            <label>Attendance (%)</label>
            <input type="number" name="attendance" min="0" max="100" step="0.01" required>

            <label>Assignment Average (marks)</label>
            <input type="number" name="assignment_average" min="0" max="100" step="0.01" required>

            <label>Internal Marks</label>
            <input type="number" name="internal_marks" min="0" max="100" step="0.01" required>

            <label>Previous Exam Marks</label>
            <input type="number" name="previous_exam_marks" min="0" max="100" step="0.01" required>

            <label>Study Hours per Week</label>
            <input type="number" name="study_hours" min="0" step="0.5" required>

            <button type="submit">Predict Performance</button>
        </form>

        <a class="history-link" href="{{ url_for('history') }}">View Prediction History</a>
    </div>
</div>
</body>
</html>
